<!DOCTYPE html>
<html>
  <head>
    <title>Plátano</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-T3c6CoIi6uLrA9TneNEoa7RxnatzjcDSCmG1MXxSR1GAsXEV/Dwwykc2MPK8M2HN" crossorigin="anonymous">
    <link rel="stylesheet" href="styles/main.css">
  </head>
  <body>
    <div class="container">

      <div class="row text-center border">
        <div class="col-6">
          <h1 class="mt-3">🐊 Koko control 🐊</h1>
        </div> <!-- .col -->
      </div> <!-- .row -->

      <div class="row">

        <div class="col-12 col-md-6">
          <video id="video" playsinline autoplay></video>
          <canvas id="canvas" width="475" height="475"></canvas>

          <div class="row">
            <div class="col-12">
              <span id="spn-sensibilidad">Sensibilidad: 1.9x, 1.9y</span>
              <p id="p-angulo">Ángulo: </p>
              <p id="p-comando">Comando: NINGUNO</p>
            </div>
          </div>
        </div>

        <div class="col-12 col-md-6">

          <div id="carrito-div">
            <img id="carrito" src="images/car.png">
          </div>

          <div id="info" class="text-center pt-3">

            <div class="form-check form-check-inline">
              <input 
                name="rad-color"
                type="radio" 
                class="form-check-input"
                value="yellow"
                id="rad-color--yellow"
                checked>
              <label 
                class="form-check-label"
                for="rad-color--yellow">
                <span class="span-color span-color--yellow"></span>
                Amarillo
              </label>
            </div> <!-- .form-check -->

            <div class="form-check form-check-inline">
              <input 
                name="rad-color"
                type="radio" 
                class="form-check-input"
                value="green"
                id="rad-color--green">
              <label 
                class="form-check-label"
                for="rad-color--green">
                <span class="span-color span-color--green"></span>
                Verde
              </label>
            </div> <!-- .form-check -->

            <div class="form-check form-check-inline">
              <input 
                name="rad-color"
                type="radio" 
                class="form-check-input"
                value="blue"
                id="rad-color--blue">
              <label 
                class="form-check-label"
                for="rad-color--blue">
                <span class="span-color span-color--blue"></span>
                Azul
              </label>
            </div> <!-- .form-check -->

            <div class="form-check form-check-inline">
              <input 
                name="rad-color"
                type="radio" 
                class="form-check-input"
                value="red"
                id="rad-color--red">
              <label 
                class="form-check-label"
                for="rad-color--red">
                <span class="span-color span-color--red"></span>
                Rojo
              </label>
            </div> <!-- .form-check -->

            <hr>

            <div class="form-check form-check-inline">
              <label class="form-check-label">Juego:</label>
            </div>
            
            <div class="form-check form-check-inline">
              <input 
                type="radio" 
                class="form-check-input"
                name="rad-game"
                value="world"
                id="rad-game--world">
              <label for="rad-game--world" class="form-check-label">
                Super Mario World
              </label>
            </div>

            <div class="form-check form-check-inline">
              <input 
                type="radio" 
                id="rad-game--kart" 
                class="form-check-input"
                name="rad-game"
                value="kart">
              <label for="rad-game--kart" class="form-check-label">
                Mario Kart
              </label>
            </div>

            <div class="form-check form-check-inline">
              <input 
                type="radio"
                id="rad-game--fox"
                class="form-check-input"
                name="rad-game"
                value="fox">
              <label for="rad-game--fox" class="form-check-label">
                Star Fox
              </label>
            </div>

            <hr>

            <label 
              for="inp-sensibilidad-y" 
              class="form-label">
              Sensibilidad vertical:
            </label>
            <input 
              class="form-range"
              type="range" 
              id="inp-sensibilidad-y"
              min="1000"
              val="1900"
              max="5000">

            <label 
              for="inp-sensibilidad-x" 
              class="form-label">
              Sensibilidad horizontal
            </label>
            <input
              class="form-range"
              type="range"
              id="inp-sensibilidad-x"
              min="1000"
              val="1900"
              max="5000">

            <div class="form-check">
              <input id="inp-invertido" type="checkbox" class="form-check-input">
              <label for="inp-invertido" class="form-check-label">
                Invertir controles
              </label>
            </div>
            
          </div> <!-- #info -->

        </div> <!-- .col -->
      </div> <!-- .row -->

    </div> <!-- .container -->

    <div id="modal" class="modal fade" tabindex="-1">
      <div class="modal-dialog">
        <div class="modal-content">
          <div class="modal-header">
            <h5 id="modal-title" class="modal-title"></h5>
            <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
          </div>
          <div id="modal-body" class="modal-body">
            
          </div>
          <div class="modal-footer">
            <button type="button" class="btn btn-primary" data-bs-dismiss="modal">Aceptar</button>
          </div>
        </div>
      </div>
    </div>
    
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js" integrity="sha384-C6RzsynM9kWDrMNeT87bh95OGNyZPhcTNXj1NW7RuBCsyN/o0jlpcV8Qyq46cDfL" crossorigin="anonymous"></script>
    <script src="scripts/platanete.js"></script>
    <script src="scripts/index.js"></script>
  </body>
</html>
